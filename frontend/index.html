<!DOCTYPE html>
<html lang="ms" data-lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UbatJelas — Faham Label Ubat Anda</title>
<meta name="description" content="UbatJelas helps you understand your prescription in simple, clear language." />
<style>
  /* ── Design tokens (matches sample_ui.html palette) ─────────────────────── */
  :root {
    --primary:        #1a56db;
    --primary-hover:  #1447b8;
    --primary-light:  #ebf2ff;
    --accent:         #2563eb;
    --warning-bg:     #fef3c7;
    --warning-text:   #78350f;
    --warning-border: #d97706;
    --danger:         #dc2626;
    --danger-bg:      #fee2e2;
    --danger-border:  #dc2626;

    --bg:             #f0f4ff;
    --surface:        #ffffff;
    --surface-2:      #f8faff;
    --surface-3:      #eef2ff;
    --border:         #c7d7f5;
    --border-focus:   #1a56db;
    --text:           #0f172a;
    --text-muted:     #475569;
    --text-light:     #94a3b8;

    --radius:         16px;
    --radius-sm:      10px;
    --radius-xs:      6px;
    --card-shadow:    0 2px 12px rgba(26,86,219,.12);

    /* Elderly-friendly base sizing: larger than typical web defaults */
    --font-size-base: 19px;
    --line-height:    1.65;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: var(--font-size-base); scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: var(--line-height);
  }

  .skip-link {
    position: absolute; top: -100px; left: 16px; background: var(--primary); color: #fff;
    padding: 10px 18px; border-radius: var(--radius-xs); font-weight: 700; z-index: 999; transition: top .2s;
  }
  .skip-link:focus { top: 16px; }

  /* ── Top bar ───────────────────────────────────────────────────────────── */
  .navbar {
    background: var(--primary); color: #fff; padding: 0 18px; min-height: 68px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); position: sticky; top: 0; z-index: 100; padding-top:10px; padding-bottom:10px;
  }
  .navbar-brand { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800; }
  .navbar-brand .brand-icon { font-size: 1.7rem; }

  select#langPicker {
    font-family: inherit; font-size: 1rem; font-weight: 700;
    border: 2px solid rgba(255,255,255,.5); border-radius: var(--radius-xs);
    padding: 10px 14px; background: rgba(255,255,255,.15); color: #fff;
    min-height: 48px; cursor: pointer;
  }
  select#langPicker option { color: var(--text); background: #fff; }

  main.app-page { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }

  .app-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: var(--radius); padding: 26px 24px; color: #fff; margin-bottom: 22px; box-shadow: var(--card-shadow);
  }
  .app-header h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 8px; }
  .app-header p { margin: 0; font-size: 1rem; opacity: .95; }

  .warning-banner {
    background: var(--warning-bg); color: var(--warning-text); border: 1.5px solid var(--warning-border);
    border-radius: var(--radius-sm); padding: 16px 18px; font-size: 1rem; font-weight: 600;
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px;
  }
  .warning-banner .w-icon { font-size: 1.3rem; flex-shrink: 0; }

  .error-box {
    border: 2px solid var(--danger-border); background: var(--danger-bg); color: var(--danger);
    border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 14px; font-weight: 600;
  }

  /* ── Cards ─────────────────────────────────────────────────────────────── */
  .card {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--card-shadow); padding: 26px 22px; margin-bottom: 20px; overflow: hidden;
  }
  .card-title {
    font-size: 1.15rem; font-weight: 800; color: var(--text); margin: 0 0 16px;
    display: flex; align-items: center; gap: 10px; overflow: hidden;
  }

  /* ── Upload zone ───────────────────────────────────────────────────────── */
  .upload-zone {
    display: block; width: 100%; box-sizing: border-box;
    border: 2.5px dashed var(--border); border-radius: var(--radius-sm); padding: 34px 18px;
    text-align: center; cursor: pointer; background: var(--surface-3); position: relative; overflow: hidden;
    transition: border-color .18s, background .18s;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
  .upload-zone:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26,86,219,.15); }
  .upload-zone input[type="file"] {display: none; position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-zone-icon { font-size: 2.8rem; margin-bottom: 10px; }
  .upload-zone-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .upload-zone-sub { font-size: .95rem; color: var(--text-muted); }
  .upload-zone-sub span { color: var(--primary); text-decoration: underline; }
  .file-chosen { margin-top: 12px; font-size: .95rem; color: var(--text-muted); font-weight: 600; }

  button {
    font-family: inherit; font-weight: 700; font-size: 1.05rem;
    min-height: 56px; padding: 12px 22px; border-radius: var(--radius-sm);
    border: none; background: var(--primary); color: #fff; cursor: pointer; width: 100%; margin-top: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .18s, transform .1s, box-shadow .18s;
  }
  button:hover { background: var(--primary-hover); box-shadow: 0 4px 16px rgba(26,86,219,.3); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  button.secondary:hover { background: var(--primary-light); }
  button.small { width: auto; min-height: 46px; font-size: .95rem; padding: 8px 16px; margin: 0; }
  button.danger-outline { background: transparent; color: var(--danger); border: 2px solid var(--danger); width: auto; min-height: 46px; padding: 8px 16px; margin: 0; font-size: .95rem; }
  button.danger-outline:hover { background: var(--danger-bg); }

  .raw-text { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .95rem; color: var(--text-muted); background: var(--surface-2); border-radius: var(--radius-xs); padding: 14px; }
  .decoded-line { margin: 0 0 10px; font-size: 1.1rem; }
  .decoded-line:last-child { margin-bottom: 0; }

  .inline-warning {
    margin-top: 16px; margin-bottom: 0; background: var(--warning-bg); color: var(--warning-text);
    border: 1.5px solid var(--warning-border); border-radius: var(--radius-sm); padding: 14px 16px;
    display: flex; gap: 10px; align-items: flex-start; font-size: .95rem;
  }

  /* ── Reminders ─────────────────────────────────────────────────────────── */
  .reminder-note { color: var(--text-muted); margin-bottom: 14px; font-size: .97rem; }
  .reminder-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .reminder-row:last-child { border-bottom: none; }
  .reminder-row .time-field { display: flex; flex-direction: column; gap: 4px; }
  .reminder-row .time-field label { font-size: .82rem; font-weight: 700; color: var(--text-muted); }
  .reminder-row input[type="time"] {
    font-family: inherit; font-size: 1.2rem; font-weight: 700; padding: 10px 12px;
    border: 2px solid var(--border); border-radius: var(--radius-xs); min-height: 52px; color: var(--text);
    background: var(--input-bg, #fff);
  }
  .reminder-row input[type="time"]:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 4px rgba(26,86,219,.15); }
  .reminder-label { color: var(--text-muted); font-size: .95rem; flex: 1; min-width: 100px; }
  .reminder-row-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }

  .switch { position: relative; width: 56px; height: 32px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 30px; cursor: pointer; transition: .2s; }
  .slider::before {
    content: ""; position: absolute; height: 24px; width: 24px; left: 4px; top: 4px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  input:checked + .slider { background: var(--primary); }
  input:checked + .slider::before { transform: translateX(24px); }

  .add-time-row { margin-top: 14px; }

  /* ── Medicine card (sticker) ───────────────────────────────────────────── */
  .sticker {
    border: 2px solid var(--primary); border-radius: var(--radius-sm); padding: 20px;
    background: var(--primary-light);
  }
  .sticker h3 { margin: 0 0 4px; font-size: 1.3rem; color: var(--primary); }
  .sticker .meta { font-size: .85rem; color: var(--text-muted); margin-bottom: 14px; }
  .sticker dl { margin: 0; }
  .sticker dt { font-size: .8rem; font-weight: 700; color: var(--text-muted); margin-top: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .sticker dd { margin: 2px 0 0; font-size: 1.1rem; }
  .pill-tag {
    display: inline-block; font-size: .85rem; font-weight: 700; color: var(--primary);
    background: #fff; border: 1.5px solid var(--primary); border-radius: 20px; padding: 4px 12px; margin-top: 14px;
  }

  /* ── Footer ────────────────────────────────────────────────────────────── */
  footer.app-footer {
    text-align: center; margin-top: 34px; padding-top: 22px; border-top: 1.5px solid var(--border);
  }
  footer.app-footer .credit { color: var(--text-muted); font-size: .9rem; margin-bottom: 8px; }
  footer.app-footer .copyright { color: var(--text-light); font-size: .85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }

  @media (max-width: 480px) {
    .reminder-row { flex-wrap: wrap; }
    .reminder-row-actions { margin-left: 0; }
  }

  /* ── Help button in navbar ─────────────────────────────────────────────── */
  #helpBtn {
    font-family: inherit; font-size: .95rem; font-weight: 700;
    background: rgba(255,255,255,.18); color: #fff;
    border: 2px solid rgba(255,255,255,.5); border-radius: var(--radius-xs);
    padding: 8px 16px; min-height: 48px; cursor: pointer; width: auto; margin: 0;
    display: flex; align-items: center; gap: 6px; transition: background .18s;
  }
  #helpBtn:hover { background: rgba(255,255,255,.32); box-shadow: none; }

  /* ── Guide modal ───────────────────────────────────────────────────────── */
  .guide-backdrop {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(15,23,42,.55); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 16px;
  }
  .guide-backdrop.open { display: flex; }

  .guide-modal {
    background: var(--surface); border-radius: var(--radius); padding: 28px 24px 24px;
    max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(26,86,219,.22); position: relative;
  }
  .guide-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 12px;
  }
  .guide-modal-title {
    font-size: 1.25rem; font-weight: 800; color: var(--primary); margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .guide-close {
    background: transparent; color: var(--text-muted); border: 2px solid var(--border);
    border-radius: var(--radius-xs); font-size: 1.1rem; font-weight: 700;
    width: auto; min-height: 44px; padding: 6px 14px; margin: 0; cursor: pointer; flex-shrink: 0;
  }
  .guide-close:hover { background: var(--surface-3); box-shadow: none; }

  .guide-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .guide-step {
    display: flex; gap: 16px; align-items: flex-start;
    background: var(--surface-2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px 18px;
  }
  .guide-step-num {
    background: var(--primary); color: #fff; border-radius: 50%;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: .95rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
  }
  .guide-step-body { flex: 1; }
  .guide-step-title { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0 0 4px; }
  .guide-step-desc { font-size: .95rem; color: var(--text-muted); margin: 0; line-height: 1.55; }

  .guide-tip {
    margin-top: 18px; background: var(--warning-bg); color: var(--warning-text);
    border: 1.5px solid var(--warning-border); border-radius: var(--radius-sm);
    padding: 14px 16px; font-size: .95rem; font-weight: 600; display: flex; gap: 10px;
  }
</style>
</head>
<body>
<a href="#mainContent" class="skip-link">Skip to content</a>

<header class="navbar">
  <div class="navbar-brand"><span class="brand-icon">💊</span><span>UbatJelas</span></div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <button id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="guideModal">
      <span>❓</span><span id="helpBtnLabel"></span>
    </button>
    <select id="langPicker" aria-label="Choose language / Pilih bahasa">
      <option value="ms">Bahasa Malaysia</option>
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
      <option value="zh">中文</option>
    </select>
  </div>
</header>

<!-- ── User Guide Modal ─────────────────────────────────────────────────── -->
<div class="guide-backdrop" id="guideBackdrop" role="dialog" aria-modal="true" aria-labelledby="guideModalTitle">
  <div class="guide-modal" id="guideModal">
    <div class="guide-modal-header">
      <h2 class="guide-modal-title" id="guideModalTitle"><span>📖</span><span id="guideTitleText"></span></h2>
      <button class="guide-close" id="guideCloseBtn" type="button" aria-label="Close guide">✕</button>
    </div>
    <ol class="guide-steps" id="guideStepsList"></ol>
    <div class="guide-tip"><span>⚠️</span><span id="guideTipText"></span></div>
  </div>
</div>

<main class="app-page" id="mainContent">

  <div class="app-header">
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
  </div>

  <div class="warning-banner">
    <span class="w-icon">⚠️</span>
    <span id="warnMain"></span>
  </div>

  <div class="card" id="uploadCard">
    <div class="card-title"><span>📷</span><span id="uploadTitle"></span></div>
    <label class="upload-zone" id="uploadZone" tabindex="0">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,application/pdf" />
      <div class="upload-zone-icon">🖼️</div>
      <div class="upload-zone-title" id="uploadZoneTitle"></div>
      <div class="upload-zone-sub" id="uploadZoneSub"></div>
    </label>
    <div class="file-chosen" id="fileChosen"></div>
    <button id="readBtn" type="button"><span>🔍</span><span id="readBtnLabel"></span></button>
    <div id="uploadError"></div>
  </div>

  <div class="card" id="extractedCard" style="display:none;">
    <div class="card-title"><span>📄</span><span id="extractedTitle"></span></div>
    <div class="raw-text" id="rawTextOut"></div>
  </div>

  <div class="card" id="decodedCard" style="display:none;">
    <div class="card-title"><span>✨</span><span id="decodedTitle"></span></div>
    <div id="decodedOut"></div>
    <div class="inline-warning">
      <span>⚠️</span><span id="inlineWarning"></span>
    </div>
  </div>

  <div class="card" id="reminderCard" style="display:none;">
    <div class="card-title"><span>⏰</span><span id="reminderTitle"></span></div>
    <div class="reminder-note" id="reminderNote"></div>
    <div id="reminderList"></div>
    <div class="add-time-row">
      <button type="button" class="secondary small" id="addManualTime"><span>➕</span><span id="addTimeLabel"></span></button>
    </div>
  </div>

  <div class="card" id="cardUbat" style="display:none;">
    <div class="card-title"><span>💊</span><span id="cardUbatTitle"></span></div>
    <div class="sticker" id="stickerOut"></div>
  </div>

  <button class="secondary" id="resetBtn" style="display:none;"><span>🔄</span><span id="resetBtnLabel"></span></button>

  <footer class="app-footer">
    <div class="credit" id="footerCredit"></div>
    <div class="copyright"><span>©</span><span id="copyrightText"></span></div>
  </footer>

</main>

/* ── Pharmacy frequency-code translations ─────────────────────────────────
   frequency_code from the backend is raw Latin/pharmacy shorthand (e.g.
   "BD", "TDS") meant for scheduling logic — not something an elderly user
   should have to decode on the Medicine Card. Map common codes to plain
   language per selected UI language. Codes not in this list fall back to
   showing the raw code as-is (safer than guessing). */
const FREQUENCY_TRANSLATIONS = {
  OD:    { ms: "Sekali sehari",     en: "Once a day",       ta: "நாளொன்றுக்கு ஒருமுறை", zh: "每天一次" },
  BD:    { ms: "Dua kali sehari",   en: "Twice a day",      ta: "நாளொன்றுக்கு இரண்டு முறை", zh: "每天两次" },
  TDS:   { ms: "Tiga kali sehari",  en: "Three times a day", ta: "நாளொன்றுக்கு மூன்று முறை", zh: "每天三次" },
  QDS:   { ms: "Empat kali sehari", en: "Four times a day", ta: "நாளொன்றுக்கு நான்கு முறை", zh: "每天四次" },
  PRN:   { ms: "Bila perlu",        en: "As needed",        ta: "தேவைப்படும்போது", zh: "需要时服用" },
  STAT:  { ms: "Serta-merta",       en: "Immediately",      ta: "உடனடியாக", zh: "立即服用" },
  NOCTE: { ms: "Setiap malam",      en: "Every night",      ta: "ஒவ்வொரு இரவும்", zh: "每晚一次" },
  MANE:  { ms: "Setiap pagi",       en: "Every morning",    ta: "ஒவ்வொரு காலையும்", zh: "每天早上" },
  HS:    { ms: "Sebelum tidur",     en: "At bedtime",       ta: "படுக்கைக்குச் செல்லும் முன்", zh: "睡前服用" }
};

function translateFrequency(code) {
  if (!code) return null;
  const entry = FREQUENCY_TRANSLATIONS[code.trim().toUpperCase()];
  return entry ? entry[lang()] : code; // unknown code: show as-is rather than guess
}

const el = (id) => document.getElementById(id);
let state = { rawText: "", frequencyCode: null, mealRelation: null, medicineName: null, duration: null };
let activeReminders = []; // [{time, label, on}]
let lastFiredMinute = {};
let alarmTimer = null;

function lang() { return el('langPicker').value; }
function t(key) { return I18N[lang()][key]; }

function applyLanguage() {
  const L = I18N[lang()];
  document.documentElement.lang = lang();
  document.documentElement.setAttribute('data-lang', lang());

  el('heroTitle').textContent = L.heroTitle;
  el('heroSubtitle').textContent = L.heroSubtitle;
  el('warnMain').textContent = L.warnMain;
  el('uploadTitle').textContent = L.uploadTitle;
  el('uploadZoneTitle').textContent = L.uploadZoneTitle;
  el('uploadZoneSub').textContent = L.uploadZoneSub;
  el('readBtnLabel').textContent = L.readBtn;
  el('extractedTitle').textContent = L.extractedTitle;
  el('decodedTitle').textContent = L.decodedTitle;
  el('reminderTitle').textContent = L.reminderTitle;
  el('addTimeLabel').textContent = L.addTimeLabel;
  el('cardUbatTitle').textContent = L.cardUbatTitle;
  el('resetBtnLabel').textContent = L.resetBtnLabel;
  el('footerCredit').textContent = L.footerCredit;
  el('copyrightText').textContent = L.copyrightText;
  el('helpBtnLabel').textContent = L.helpBtn;

  const fileName = el('fileInput').files[0]?.name;
  el('fileChosen').textContent = fileName ? (L.fileChosenPrefix + fileName) : "";

  renderReminderList();
  if (state.medicineName !== undefined && el('cardUbat').style.display !== 'none') renderCardUbat();

  // Re-render guide content in the new language (even if modal is closed,
  // so it's already correct when the user opens it next).
  renderGuide();
}

el('langPicker').addEventListener('change', applyLanguage);
applyLanguage();

function setLoading(btn, loading) {
  btn.disabled = loading;
  el('readBtnLabel').textContent = loading ? t('readBtnLoading') : t('readBtn');
}

el('fileInput').addEventListener('change', () => {
  const f = el('fileInput').files[0];
  el('fileChosen').textContent = f ? (t('fileChosenPrefix') + f.name) : "";
});

const uploadZone = el('uploadZone');
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) {
    el('fileInput').files = e.dataTransfer.files;
    el('fileChosen').textContent = t('fileChosenPrefix') + e.dataTransfer.files[0].name;
  }
});

el('readBtn').addEventListener('click', async () => {
  const file = el('fileInput').files[0];
  el('uploadError').innerHTML = "";
  if (!file) {
    el('uploadError').innerHTML = `<div class="error-box">${t('errNoFile')}</div>`;
    return;
  }
  const btn = el('readBtn');
  setLoading(btn, true);

  try {
    const form = new FormData();
    form.append('file', file);
    form.append('session_language', lang());

    const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: form });
    const data = await res.json();

    if (!data.passed_confidence_check) {
      el('uploadError').innerHTML = `<div class="error-box">${data.message || t('errGeneric')}</div>`;
      setLoading(btn, false);
      return;
    }

    state.rawText = data.raw_text;
    el('rawTextOut').textContent = data.raw_text;
    el('extractedCard').style.display = 'block';

    await runTranslate();
  } catch (e) {
    el('uploadError').innerHTML = `<div class="error-box">${t('errGeneric')}</div>`;
  } finally {
    setLoading(btn, false);
  }
});

async function runTranslate() {
  const res = await fetch(`${API_URL}/translate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ raw_text: state.rawText, session_language: lang() })
  });
  const data = await res.json();

  state.frequencyCode = data.frequency_code;
  state.mealRelation = data.meal_relation;
  state.medicineName = data.medicine_name;
  state.duration = data.duration;

  el('decodedOut').innerHTML = data.translated_text.split('\n').map(line => line.trim() ? `<p class="decoded-line">${line}</p>` : '').join('');
  el('inlineWarning').textContent = data.warning_text;
  el('decodedCard').style.display = 'block';

  await runReminder();
  renderCardUbat();
  el('resetBtn').style.display = 'block';
}

async function runReminder(manualTimes) {
  const res = await fetch(`${API_URL}/reminder`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      frequency_code: state.frequencyCode,
      meal_relation: state.mealRelation,
      manual_times: manualTimes || null,
      session_language: lang()
    })
  });
  const data = await res.json();
  el('reminderCard').style.display = 'block';
  el('reminderNote').textContent = data.note || "";

  activeReminders = data.proposed_times.map(p => ({ time: p.time, label: p.label, on: false }));
  if (activeReminders.length === 0) activeReminders.push({ time: "08:00", label: "", on: false });
  renderReminderList();
}

function renderReminderList() {
  const list = el('reminderList');
  list.innerHTML = "";
  const L = I18N[lang()];
  activeReminders.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'reminder-row';
    row.innerHTML = `
      <div class="time-field">
        <label for="time-${i}">${L.reminderRowLabel}</label>
        <input type="time" id="time-${i}" data-idx="${i}" value="${r.time}">
      </div>
      <div class="reminder-label">${r.label || ""}</div>
      <div class="reminder-row-actions">
        <label class="switch">
          <input type="checkbox" data-idx="${i}" ${r.on ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
        <button type="button" class="danger-outline remove-time" data-idx="${i}">${L.removeLabel}</button>
      </div>`;
    list.appendChild(row);
  });

  list.querySelectorAll('input[type=time]').forEach(inp => {
    inp.addEventListener('change', (ev) => {
      const idx = +ev.target.dataset.idx;
      activeReminders[idx].time = ev.target.value;
    });
  });
  list.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', async (ev) => {
      const idx = +ev.target.dataset.idx;
      activeReminders[idx].on = ev.target.checked;
      if (ev.target.checked && 'Notification' in window && Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch (e) {}
      }
      startAlarmLoop();
    });
  });
  list.querySelectorAll('.remove-time').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      const idx = +ev.currentTarget.dataset.idx;
      activeReminders.splice(idx, 1);
      renderReminderList();
    });
  });
}

el('addManualTime').addEventListener('click', () => {
  activeReminders.push({ time: "08:00", label: "", on: false });
  renderReminderList();
});

function startAlarmLoop() {
  if (alarmTimer) return;
  alarmTimer = setInterval(checkAlarms, 15000);
  checkAlarms();
}

function checkAlarms() {
  const now = new Date();
  const hhmm = now.toTimeString().slice(0, 5);
  const minuteKey = now.toISOString().slice(0, 16);
  activeReminders.forEach(r => {
    if (r.on && r.time === hhmm && lastFiredMinute[r.time] !== minuteKey) {
      lastFiredMinute[r.time] = minuteKey;
      fireReminder(r);
    }
  });
}

function fireReminder(r) {
  const title = "UbatJelas";
  const body = `${r.label || ''} — ${r.time}`.trim();
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  }
  beep();
  alert(`⏰ ${title}\n${body}`);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

function renderCardUbat() {
  const s = state;
  const L = I18N[lang()];
  el('stickerOut').innerHTML = `
    <h3>${s.medicineName || L.defaultMed}</h3>
    <div class="meta">UbatJelas</div>
    <dl>
      <dt>${L.frequencyLabel}</dt><dd>${translateFrequency(s.frequencyCode) || L.notSet} ${s.mealRelation ? '(' + s.mealRelation + ')' : ''}</dd>
      <dt>${L.durationLabel}</dt><dd>${s.duration || L.notSet}</dd>
    </dl>
    <div class="pill-tag">${L.pillTag}</div>
  `;
  el('cardUbat').style.display = 'block';
}

el('resetBtn').addEventListener('click', () => window.location.reload());

/* ── User Guide modal ──────────────────────────────────────────────────── */
function renderGuide() {
  const L = I18N[lang()];
  el('guideTitleText').textContent = L.guideTitle;
  el('guideTipText').textContent = L.guideTip;

  const list = el('guideStepsList');
  list.innerHTML = "";
  L.guideSteps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'guide-step';
    li.innerHTML = `
      <div class="guide-step-num" aria-hidden="true">${i + 1}</div>
      <div class="guide-step-body">
        <div class="guide-step-title">${step.icon} ${step.title}</div>
        <p class="guide-step-desc">${step.desc}</p>
      </div>`;
    list.appendChild(li);
  });
}

function openGuide() {
  el('guideBackdrop').classList.add('open');
  el('guideCloseBtn').focus();
  document.body.style.overflow = 'hidden'; // prevent background scroll
}

function closeGuide() {
  el('guideBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  el('helpBtn').focus(); // return focus to trigger button
}

el('helpBtn').addEventListener('click', openGuide);
el('guideCloseBtn').addEventListener('click', closeGuide);

// Close on backdrop click (clicking outside the modal panel)
el('guideBackdrop').addEventListener('click', (e) => {
  if (e.target === el('guideBackdrop')) closeGuide();
});

// Close on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && el('guideBackdrop').classList.contains('open')) closeGuide();
});

// Render once on page load (applyLanguage also calls this, but call here to be safe)
renderGuide();
</script>
